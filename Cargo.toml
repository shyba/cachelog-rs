[package]
name = "cachelog-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "cachelog_rs"

[features]
default = []
loom = ["scc/loom", "dep:loom"]

[dev-dependencies]
cachelog-core = { path = "cachelog-core", default-features = false, features = ["serde"] }
cachelog-model = { path = "model-cachelog" }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
loom = "0.7"

[[bench]]
name = "live"
harness = false

[dependencies]
crossbeam-queue = "0.3"
loom = { version = "0.7", optional = true }
parking_lot = "0.12"
scc = "3.6.12"
