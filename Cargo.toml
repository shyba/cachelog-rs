[package]
name = "cachelog"
version = "0.2.1"
edition = "2024"
autobenches = false
license = "MIT"
keywords = ["concurrent", "write-ahead-log", "key-value", "map"]
description = "A concurrent fast key-value map with a built-in write log and cache layer."
repository = "https://github.com/shyba/cachelog-rs"

[lib]
name = "cachelog"

[features]
default = []
dev-tools = []
loom = ["scc/loom", "dep:loom"]

[dev-dependencies]
cachelog-core = { path = "cachelog-core", default-features = false, features = ["serde"] }
cachelog-model = { path = "model-cachelog" }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
loom = "0.7"
proptest = "1"

[[bench]]
name = "live"
harness = false
required-features = ["dev-tools"]

[[bin]]
name = "coalesced_hotpath"
path = "src/bin/coalesced_hotpath.rs"
required-features = ["dev-tools"]

[dependencies]
bytes = "1"
ahash = "0.8"
arc-swap = "1"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
loom = { version = "0.7", optional = true }
parking_lot = "0.12"
qp-trie = "0.8.2"
scc = "3.6.12"
