[package]
name = "cachelog-model"
version = "0.1.0"
edition = "2024"

[lib]
name = "cachelog_model"

[[bin]]
name = "cachelog-model"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
cli = []
tla-connect = ["dep:tla-connect", "dep:itf"]

[dependencies]
cachelog-core = { path = "../cachelog-core", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tla-connect = { path = "tla-connect-shim", optional = true }
itf = { version = "0.4.0", optional = true }

[dev-dependencies]
tempfile = "3"
