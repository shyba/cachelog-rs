[package]
name = "cachelog-model"
version = "0.1.0"
edition = "2024"

[lib]
name = "cachelog_model"

[features]
default = []
creusot = ["dep:creusot-contracts"]
tla-connect = ["dep:tla-connect", "dep:itf"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
creusot-contracts = { version = "0.8.0", optional = true }
tla-connect = { version = "0.0.4", optional = true }
itf = { version = "0.4.0", optional = true }

[dev-dependencies]
tempfile = "3"
